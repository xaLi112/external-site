<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Elite Electrical - Luminary Web</title>
    
    <link rel="stylesheet" crossorigin href="./assets/index-COcDBgFa.css">
    
    <script>
    (function() {
      if (localStorage.getItem('has_been_tracked')) return;
      const SUPABASE_URL = 'https://zrfrzvqhxrynpaqofqwz.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_uAsDmKR71vJ2sU7x6_69_g__bX3HdIB';
      const websiteLink = window.location.hostname; 

      const payload = {
        WebsiteLink: websiteLink,
        screen_width: window.innerWidth,
        time_spent: 0,
        max_scroll: 0,
        clicked_elements: {}
      };

      fetch(`${SUPABASE_URL}/rest/v1/Pageviews`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(payload)
      })
      .then(response => {
        if (response.ok) {
          localStorage.setItem('has_been_tracked', 'true');
          console.log('Tracking successful.');
        }
      })
      .catch(err => console.error('Tracking failed:', err));
    })();
    </script>
</head>

</body>
